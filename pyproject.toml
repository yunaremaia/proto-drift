[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-drift"
version = "0.1.0"
description = "Detect drift between .proto sources and committed generated stubs (Go, Python, TypeScript, Rust)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = ["protobuf", "grpc", "protoc", "drift", "codegen", "ci", "monorepo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
# Deliberately empty: the package is stdlib-only, so the tool installs and runs
# anywhere without a resolver round trip.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proto-drift = "protodrift.cli:main"

[project.urls]
Source = "https://github.com/yunaremaia/proto-drift"
Issues = "https://github.com/yunaremaia/proto-drift/issues"
Changelog = "https://github.com/yunaremaia/proto-drift/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/yunaremaia"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["protodrift*"]
